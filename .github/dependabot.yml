version: 2

# The workflow pins actions to commit SHAs, which cannot be repointed but also
# never pick up a fix on their own. These updates are what unfreezes them: a PR
# per bump, rewriting the SHA and the version comment beside it.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      # vitest belongs in this group despite not being a Cloudflare package:
      # @cloudflare/vitest-pool-workers declares a peer range on it, so bumping
      # either one alone fails to resolve. wrangler and the workers types track
      # the same runtime and are kept with them.
      cloudflare:
        patterns:
          - wrangler
          - vitest
          - '@cloudflare/*'
    # The Cloudflare stack moves as one piece, and it is currently pinned by
    # @cloudflare/vitest-pool-workers 0.9.14: it depends on wrangler at an exact
    # 4.44.0, whose peer range wants @cloudflare/workers-types ^4, and it peers
    # vitest at 2.0.x - 3.2.x. So nothing here can advance alone — a newer
    # wrangler wants workers-types ^5, which the pool's nested wrangler refuses.
    #
    # Moving the pool is the unlock, and it is a migration rather than a bump:
    # 0.20 dropped the "/config" export and defineWorkersProject with it, which
    # all three vitest configs import, and moved the cloudflare:test types behind
    # "/types". Lift all four of these together once that is done.
    #
    # Patch updates still come through, which is what carries a security fix.
    ignore:
      - dependency-name: '@cloudflare/vitest-pool-workers'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: wrangler
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@cloudflare/workers-types'
        update-types:
          - version-update:semver-major
